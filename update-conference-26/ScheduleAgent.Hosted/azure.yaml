# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
requiredVersions:
    azd: '>=1.35.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.19'
name: update-conference-schedule
services:
    update-schedule:
        project: .
        host: azure.ai.agent
        language: csharp
        startupCommand: dotnet run --project ScheduleAgent.Hosted.csproj
        displayName: Update Conference Schedule
        description: Answers caller questions using the bundled canonical conference schedule.
        uses:
            - conference-project
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            EnableSensitiveTelemetry: ${ENABLE_SENSITIVE_TELEMETRY}
        codeConfiguration:
            dependencyResolution: bundled
            entryPoint: ScheduleAgent.Hosted.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: update-schedule
        protocols:
            - protocol: responses
              version: 2.0.0
    conference-project:
        host: azure.ai.project
        endpoint: ${AZURE_AI_PROJECT_ENDPOINT}
infra:
    provider: microsoft.foundry
