<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="590" viewBox="0 0 1120 590" role="img" aria-labelledby="title description">
  <title id="title">Agentic RAG workflow</title>
  <desc id="description">A query retrieves candidate evidence. An agent validates sources, checks conflicts, and decomposes complex questions. If evidence is insufficient, it issues subqueries or searches the web, then reevaluates before synthesizing a cited answer with gaps disclosed.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#52636b" />
    </marker>
  </defs>
  <rect width="1120" height="590" fill="#f7f8f6" rx="18" />
  <text x="44" y="54" fill="#18343b" font-family="Segoe UI, sans-serif" font-size="29" font-weight="700">Agentic RAG: retrieve, assess, and fill knowledge gaps</text>
  <text x="44" y="83" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="15">The agent reasons over evidence instead of passing the first retrieval results straight to generation</text>

  <rect x="30" y="166" width="145" height="110" rx="10" fill="#e2f1ee" stroke="#76a99e" stroke-width="2" />
  <text x="102" y="207" text-anchor="middle" fill="#18343b" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700">User query</text>
  <text x="102" y="235" text-anchor="middle" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="13">question / goal</text>

  <rect x="215" y="146" width="190" height="150" rx="12" fill="#e9edf7" stroke="#9aa8c2" stroke-width="2" />
  <text x="310" y="184" text-anchor="middle" fill="#18343b" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700">Retrieve</text>
  <text x="310" y="216" text-anchor="middle" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="14">chunked index</text>
  <text x="310" y="241" text-anchor="middle" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="14">hybrid search / rerank</text>
  <text x="310" y="268" text-anchor="middle" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="12">candidate sources + metadata</text>

  <rect x="445" y="126" width="205" height="190" rx="12" fill="#18343b" />
  <text x="547" y="165" text-anchor="middle" fill="#c7e9df" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" letter-spacing="1">AGENT ASSESSMENT</text>
  <path d="M479 182 H615" stroke="#557279" stroke-width="1" />
  <text x="547" y="213" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="14">validate source, freshness,</text>
  <text x="547" y="236" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="14">authority, relevance</text>
  <text x="547" y="262" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="14">check conflicts and coverage</text>
  <text x="547" y="289" text-anchor="middle" fill="#d5e0df" font-family="Segoe UI, sans-serif" font-size="12">decompose into subqueries if needed</text>

  <path d="M735 154 L810 220 L735 286 L660 220 Z" fill="#fff0e8" stroke="#d99b76" stroke-width="2" />
  <text x="735" y="211" text-anchor="middle" fill="#18343b" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">Sufficient,</text>
  <text x="735" y="232" text-anchor="middle" fill="#18343b" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">reliable evidence?</text>

  <rect x="870" y="166" width="215" height="110" rx="10" fill="#e2f1ee" stroke="#76a99e" stroke-width="2" />
  <text x="977" y="205" text-anchor="middle" fill="#18343b" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700">Synthesize answer</text>
  <text x="977" y="233" text-anchor="middle" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="13">cite evidence; disclose gaps</text>
  <text x="977" y="255" text-anchor="middle" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="12">or abstain if unresolved</text>

  <rect x="560" y="385" width="290" height="92" rx="12" fill="#fce8e7" stroke="#d58c86" stroke-width="2" />
  <text x="705" y="418" text-anchor="middle" fill="#18343b" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700">Knowledge gap or conflict</text>
  <text x="705" y="444" text-anchor="middle" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="13">form subqueries; use internal or web search</text>
  <text x="705" y="464" text-anchor="middle" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="12">then validate the new evidence</text>

  <path d="M175 221 H215 M405 221 H445 M650 221 H660 M810 220 H870" fill="none" stroke="#52636b" stroke-width="2.5" marker-end="url(#arrow)" />
  <path d="M735 286 V385" fill="none" stroke="#52636b" stroke-width="2.5" marker-end="url(#arrow)" />
  <path d="M560 431 H310 V296" fill="none" stroke="#52636b" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)" />
  <text x="824" y="211" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="12">Yes</text>
  <text x="747" y="343" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="12">No / investigate</text>

  <text x="560" y="529" text-anchor="middle" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="14">Agentic RAG can improve coverage, but adds reasoning steps, tool calls, latency, cost, and new failure modes.</text>
</svg>
