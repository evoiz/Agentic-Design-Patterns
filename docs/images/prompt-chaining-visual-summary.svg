<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-labelledby="title description">
  <title id="title">Prompt chaining visual summary</title>
  <desc id="description">A task flows through focused stages, with each stage's structured output becoming the next stage's input.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#52636b" />
    </marker>
  </defs>
  <rect width="980" height="420" rx="18" fill="#f7f8f6" />
  <text x="48" y="58" fill="#18343b" font-family="Segoe UI, sans-serif" font-size="30" font-weight="700">Prompt chaining: make each handoff explicit</text>
  <text x="48" y="88" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="16">A fixed sequence of focused steps turns a broad task into inspectable work</text>
  <path d="M210 230 H278 M446 230 H514 M682 230 H750" fill="none" stroke="#52636b" stroke-width="2.5" marker-end="url(#arrow)" />
  <rect x="48" y="175" width="162" height="110" rx="12" fill="#e2f1ee" stroke="#76a99e" stroke-width="2" />
  <text x="129" y="218" text-anchor="middle" fill="#18343b" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">Task</text>
  <text x="129" y="246" text-anchor="middle" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="14">request + context</text>
  <rect x="278" y="175" width="168" height="110" rx="12" fill="#e9edf7" stroke="#9aa8c2" stroke-width="2" />
  <text x="362" y="218" text-anchor="middle" fill="#18343b" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">Stage 1</text>
  <text x="362" y="246" text-anchor="middle" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="14">extract requirements</text>
  <rect x="514" y="175" width="168" height="110" rx="12" fill="#fff0e8" stroke="#d99b76" stroke-width="2" />
  <text x="598" y="218" text-anchor="middle" fill="#18343b" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">Stage 2</text>
  <text x="598" y="246" text-anchor="middle" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="14">produce a draft</text>
  <rect x="750" y="175" width="182" height="110" rx="12" fill="#e2f1ee" stroke="#76a99e" stroke-width="2" />
  <text x="841" y="218" text-anchor="middle" fill="#18343b" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">Stage 3</text>
  <text x="841" y="246" text-anchor="middle" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="14">validate and return</text>
  <text x="490" y="350" text-anchor="middle" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="14">Validate each boundary; stop or surface errors instead of passing malformed output downstream.</text>
</svg>
