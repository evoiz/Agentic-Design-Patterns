<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title description">
  <title id="title">Decision Models visual summary</title>
  <desc id="description">Evidence and explicit criteria produce a typed decision that deterministic validation can use to route or gate work.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#52636b" />
    </marker>
  </defs>
  <rect width="980" height="430" rx="18" fill="#f7f8f6" />
  <text x="48" y="58" fill="#18343b" font-family="Segoe UI, sans-serif" font-size="30" font-weight="700">Decision Models: judgment with a contract</text>
  <text x="48" y="88" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="16">Separate model judgment from deterministic control-flow enforcement</text>
  <path d="M230 220 H300 M500 220 H570 M770 220 H840" fill="none" stroke="#52636b" stroke-width="2.5" marker-end="url(#arrow)" />
  <rect x="48" y="160" width="182" height="120" rx="12" fill="#e2f1ee" stroke="#76a99e" stroke-width="2" />
  <text x="139" y="204" text-anchor="middle" fill="#18343b" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">Evidence</text>
  <text x="139" y="234" text-anchor="middle" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="14">request + signals</text>
  <text x="139" y="256" text-anchor="middle" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="14">explicit criteria</text>
  <rect x="300" y="160" width="200" height="120" rx="12" fill="#18343b" />
  <text x="400" y="204" text-anchor="middle" fill="#c7e9df" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">MODEL JUDGMENT</text>
  <text x="400" y="238" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">Typed decision</text>
  <text x="400" y="260" text-anchor="middle" fill="#d5e0df" font-family="Segoe UI, sans-serif" font-size="14">label + confidence</text>
  <rect x="570" y="160" width="200" height="120" rx="12" fill="#fff0e8" stroke="#d99b76" stroke-width="2" />
  <text x="670" y="204" text-anchor="middle" fill="#18343b" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">Validate</text>
  <text x="670" y="234" text-anchor="middle" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="14">schema + thresholds</text>
  <text x="670" y="256" text-anchor="middle" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="14">safe fallback</text>
  <rect x="840" y="160" width="100" height="120" rx="12" fill="#e9edf7" stroke="#9aa8c2" stroke-width="2" />
  <text x="890" y="204" text-anchor="middle" fill="#18343b" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700">Route</text>
  <text x="890" y="234" text-anchor="middle" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="13">rank / gate</text>
  <text x="490" y="350" text-anchor="middle" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="14">A model decision informs control flow; application code enforces the decision contract.</text>
</svg>
