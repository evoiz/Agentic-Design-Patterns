<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" role="img" aria-labelledby="title description">
  <title id="title">Planning pattern visual summary</title>
  <desc id="description">A goal and current state go to a planner, which proposes steps for a research task. Results are checked against the goal, and new information can trigger replanning.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#52636b" />
    </marker>
  </defs>
  <rect width="1080" height="500" fill="#f7f8f6" rx="18" />
  <text x="48" y="58" fill="#18343b" font-family="Segoe UI, sans-serif" font-size="30" font-weight="700">Planning: discover the how</text>
  <text x="48" y="88" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="16">Move from the current state toward a goal with an inspectable, adaptable sequence</text>

  <rect x="42" y="188" width="190" height="112" rx="10" fill="#e2f1ee" stroke="#76a99e" stroke-width="2" />
  <text x="137" y="225" text-anchor="middle" fill="#18343b" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700">Research goal</text>
  <text x="137" y="252" text-anchor="middle" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="14">question + current</text>
  <text x="137" y="274" text-anchor="middle" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="14">knowledge / constraints</text>

  <rect x="284" y="170" width="170" height="148" rx="12" fill="#18343b" />
  <text x="369" y="211" text-anchor="middle" fill="#c7e9df" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" letter-spacing="1">PLANNER</text>
  <path d="M316 229 H422" stroke="#557279" stroke-width="1" />
  <text x="369" y="263" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">Propose steps</text>
  <text x="369" y="289" text-anchor="middle" fill="#d5e0df" font-family="Segoe UI, sans-serif" font-size="13">ordered and bounded</text>

  <rect x="510" y="130" width="154" height="80" rx="10" fill="#fff0e8" stroke="#d99b76" stroke-width="2" />
  <text x="587" y="164" text-anchor="middle" fill="#18343b" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">1. Gather</text>
  <text x="587" y="188" text-anchor="middle" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="13">search sources</text>

  <rect x="510" y="235" width="154" height="80" rx="10" fill="#e9edf7" stroke="#9aa8c2" stroke-width="2" />
  <text x="587" y="269" text-anchor="middle" fill="#18343b" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">2. Analyze</text>
  <text x="587" y="293" text-anchor="middle" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="13">compare evidence</text>

  <rect x="510" y="340" width="154" height="80" rx="10" fill="#e2f1ee" stroke="#76a99e" stroke-width="2" />
  <text x="587" y="374" text-anchor="middle" fill="#18343b" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">3. Synthesize</text>
  <text x="587" y="398" text-anchor="middle" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="13">draft findings</text>

  <rect x="730" y="200" width="158" height="116" rx="12" fill="#fce8e7" stroke="#d58c86" stroke-width="2" />
  <text x="809" y="239" text-anchor="middle" fill="#18343b" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Check goal</text>
  <text x="809" y="267" text-anchor="middle" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="13">enough evidence?</text>
  <text x="809" y="288" text-anchor="middle" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="13">gaps or new constraints?</text>

  <rect x="930" y="200" width="116" height="116" rx="12" fill="#fff0e8" stroke="#d99b76" stroke-width="2" />
  <text x="988" y="241" text-anchor="middle" fill="#18343b" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Goal</text>
  <text x="988" y="265" text-anchor="middle" fill="#18343b" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">met?</text>
  <text x="988" y="291" text-anchor="middle" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="12">finish or replan</text>

  <path d="M232 244 H284 M454 244 H480 V170 H510 M664 170 H696 V226 H730 M664 275 H730 M664 380 H696 V290 H730 M888 258 H930" fill="none" stroke="#52636b" stroke-width="2.5" marker-end="url(#arrow)" />
  <path d="M988 316 V450 H369 V318" fill="none" stroke="#52636b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)" />
  <text x="678" y="443" text-anchor="middle" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="13">New evidence or obstacles can change the next steps; stop when the goal is met or limits are reached.</text>
</svg>
