<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500" role="img" aria-labelledby="title description">
  <title id="title">Routing pattern visual summary</title>
  <desc id="description">A user request and current workflow state go to a router, which chooses an appropriate specialist path or asks for clarification; the selected path returns a response.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#52636b" />
    </marker>
  </defs>
  <rect width="980" height="500" fill="#f7f8f6" rx="18" />
  <text x="48" y="58" fill="#18343b" font-family="Segoe UI, sans-serif" font-size="30" font-weight="700">Routing: choose the next path</text>
  <text x="48" y="88" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="16">A conditional decision adapts execution to the request or current state</text>

  <rect x="48" y="195" width="190" height="110" rx="12" fill="#e2f1ee" stroke="#76a99e" stroke-width="2" />
  <text x="143" y="238" text-anchor="middle" fill="#18343b" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">User request</text>
  <text x="143" y="268" text-anchor="middle" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="14">+ current state</text>

  <rect x="330" y="165" width="238" height="170" rx="14" fill="#18343b" />
  <text x="449" y="212" text-anchor="middle" fill="#c7e9df" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" letter-spacing="1">ROUTER</text>
  <path d="M372 231 H526" stroke="#557279" stroke-width="1" />
  <text x="449" y="269" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">Classify or decide</text>
  <text x="449" y="298" text-anchor="middle" fill="#d5e0df" font-family="Segoe UI, sans-serif" font-size="14">choose a defined route</text>

  <rect x="688" y="116" width="238" height="78" rx="10" fill="#fff0e8" stroke="#d99b76" stroke-width="2" />
  <text x="807" y="148" text-anchor="middle" fill="#18343b" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700">Specialist A</text>
  <text x="807" y="173" text-anchor="middle" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="14">tool, function, or agent</text>

  <rect x="688" y="222" width="238" height="78" rx="10" fill="#e9edf7" stroke="#9aa8c2" stroke-width="2" />
  <text x="807" y="254" text-anchor="middle" fill="#18343b" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700">Specialist B</text>
  <text x="807" y="279" text-anchor="middle" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="14">tool, function, or agent</text>

  <rect x="688" y="328" width="238" height="78" rx="10" fill="#fce8e7" stroke="#d58c86" stroke-width="2" />
  <text x="807" y="360" text-anchor="middle" fill="#18343b" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700">Clarify / fallback</text>
  <text x="807" y="385" text-anchor="middle" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="14">unclear or unsupported route</text>

  <path d="M238 250 H330" fill="none" stroke="#52636b" stroke-width="2.5" marker-end="url(#arrow)" />
  <path d="M568 220 C620 220 627 155 688 155" fill="none" stroke="#52636b" stroke-width="2.5" marker-end="url(#arrow)" />
  <path d="M568 250 H688" fill="none" stroke="#52636b" stroke-width="2.5" marker-end="url(#arrow)" />
  <path d="M568 280 C620 280 627 367 688 367" fill="none" stroke="#52636b" stroke-width="2.5" marker-end="url(#arrow)" />
  <path d="M807 194 V222 M807 300 V328" fill="none" stroke="#8a999b" stroke-width="1.5" stroke-dasharray="5 5" />

  <text x="488" y="456" text-anchor="middle" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="14">Routing selects the path; authorization and consequential actions remain with application policy.</text>
</svg>
