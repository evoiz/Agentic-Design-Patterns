<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" role="img" aria-labelledby="title description">
  <title id="title">Memory management visual summary</title>
  <desc id="description">Recent interaction remains in short-term context while selected durable facts are stored and retrieved under policy.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#52636b" />
    </marker>
  </defs>
  <rect width="980" height="470" rx="18" fill="#f7f8f6" />
  <text x="48" y="58" fill="#18343b" font-family="Segoe UI, sans-serif" font-size="30" font-weight="700">Memory: retain selectively, retrieve by need</text>
  <text x="48" y="88" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="16">Short-term context and durable memory have different lifetimes and controls</text>
  <path d="M230 235 H320 M500 235 H590 M770 210 C830 170 830 150 770 150 M590 260 C520 340 350 340 230 260" fill="none" stroke="#52636b" stroke-width="2.5" marker-end="url(#arrow)" />
  <rect x="48" y="175" width="182" height="120" rx="12" fill="#e2f1ee" stroke="#76a99e" stroke-width="2" />
  <text x="139" y="215" text-anchor="middle" fill="#18343b" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700">Interaction</text>
  <text x="139" y="244" text-anchor="middle" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="14">messages + results</text>
  <text x="139" y="266" text-anchor="middle" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="14">session state</text>
  <rect x="320" y="175" width="180" height="120" rx="12" fill="#e9edf7" stroke="#9aa8c2" stroke-width="2" />
  <text x="410" y="215" text-anchor="middle" fill="#18343b" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700">Short-term</text>
  <text x="410" y="244" text-anchor="middle" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="14">active context</text>
  <text x="410" y="266" text-anchor="middle" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="14">bounded window</text>
  <rect x="590" y="175" width="180" height="120" rx="12" fill="#fff0e8" stroke="#d99b76" stroke-width="2" />
  <text x="680" y="215" text-anchor="middle" fill="#18343b" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700">Write policy</text>
  <text x="680" y="244" text-anchor="middle" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="14">what may persist?</text>
  <text x="680" y="266" text-anchor="middle" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="14">consent + retention</text>
  <rect x="800" y="120" width="150" height="90" rx="12" fill="#18343b" />
  <text x="875" y="158" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700">Long-term</text>
  <text x="875" y="184" text-anchor="middle" fill="#d5e0df" font-family="Segoe UI, sans-serif" font-size="14">external store</text>
  <text x="490" y="415" text-anchor="middle" fill="#52636b" font-family="Segoe UI, sans-serif" font-size="14">Scope retrieval, updates, privacy, staleness, and deletion explicitly.</text>
</svg>
