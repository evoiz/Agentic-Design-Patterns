# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    azd: '>=1.35.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.19'
name: chapter09-learning-adaptation
services:
    chapter09-learning-adaptation:
        project: .
        host: azure.ai.agent
        language: csharp
        startupCommand: dotnet run --project LearningAdaptation.Hosted.csproj
        displayName: Chapter 09 - Learning and Adaptation
        description: Evaluates a bounded prompt proposal against a fixed benchmark; changes require review.
        uses:
            - foundry-project
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
        codeConfiguration:
            dependencyResolution: bundled
            entryPoint: LearningAdaptation.Hosted.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: chapter09-learning-adaptation
        protocols:
            - protocol: responses
              version: 2.0.0
    foundry-project:
        host: azure.ai.project
        endpoint: ${AZURE_AI_PROJECT_ENDPOINT}
infra:
    provider: microsoft.foundry
