# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    azd: '>=1.35.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.19'
name: chapter16-resource-optimization
services:
    chapter16-resource-optimization:
        project: .
        host: azure.ai.agent
        language: csharp
        startupCommand: dotnet run --project ResourceOptimization.Hosted.csproj
        displayName: Chapter 16 - Resource Optimization
        description: Routes each request to an appropriate model deployment and uses Foundry web search for current information.
        uses:
            - foundry-project
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            Foundry__ModelDeployments__fast: ${FOUNDRY_MODEL_DEPLOYMENT_FAST}
            Foundry__ModelDeployments__reasoning: ${FOUNDRY_MODEL_DEPLOYMENT_REASONING}
            Foundry__ModelDeployments__quality: ${FOUNDRY_MODEL_DEPLOYMENT_QUALITY}
        codeConfiguration:
            dependencyResolution: bundled
            entryPoint: ResourceOptimization.Hosted.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: chapter16-resource-optimization
        protocols:
            - protocol: responses
              version: 2.0.0
    foundry-project:
        host: azure.ai.project
        endpoint: ${AZURE_AI_PROJECT_ENDPOINT}
infra:
    provider: microsoft.foundry
