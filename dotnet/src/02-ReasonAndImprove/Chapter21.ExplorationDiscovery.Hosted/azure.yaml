# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    azd: '>=1.35.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.19'
name: chapter21-exploration-discovery
services:
    chapter21-exploration-discovery:
        project: .
        host: azure.ai.agent
        language: csharp
        startupCommand: dotnet run --project Chapter21.ExplorationDiscovery.Hosted.csproj
        displayName: Chapter 21 - Exploration and Discovery
        description: Produces a bounded research proposal and reviews it from three independent perspectives.
        uses:
            - mvp-playground-foundry-proj
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5-mini
        codeConfiguration:
            dependencyResolution: bundled
            entryPoint: Chapter21.ExplorationDiscovery.Hosted.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: chapter21-exploration-discovery
        protocols:
            - protocol: responses
              version: 2.0.0
    mvp-playground-foundry-proj:
        host: azure.ai.project
        endpoint: https://mvp-playground-foundry.services.ai.azure.com/api/projects/mvp-playground-foundry-proj
infra:
    provider: microsoft.foundry
