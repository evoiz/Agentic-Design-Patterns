# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    azd: '>=1.35.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.19'
name: chapter20-prioritization
services:
    chapter20-prioritization:
        project: .
        host: azure.ai.agent
        language: csharp
        startupCommand: dotnet run --project Chapter20.Prioritization.Hosted.csproj
        displayName: Chapter 20 - Prioritization
        description: Proposes task priorities and returns a validated deterministic priority queue.
        uses:
            - mvp-playground-foundry-proj
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5.4-mini
        codeConfiguration:
            dependencyResolution: bundled
            entryPoint: Chapter20.Prioritization.Hosted.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: chapter20-prioritization
        protocols:
            - protocol: responses
              version: 2.0.0
    mvp-playground-foundry-proj:
        host: azure.ai.project
        endpoint: https://mvp-playground-foundry.services.ai.azure.com/api/projects/mvp-playground-foundry-proj
infra:
    provider: microsoft.foundry
