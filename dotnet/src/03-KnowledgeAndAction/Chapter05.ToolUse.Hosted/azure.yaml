# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    azd: '>=1.35.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.19'
name: chapter05-tool-use
services:
    chapter05-tool-use:
        project: .
        host: azure.ai.agent
        language: csharp
        startupCommand: dotnet run --project Chapter05.ToolUse.Hosted.csproj
        displayName: Chapter 05 - Tool Use
        description: Selects and invokes a narrow lookup or calculator function to answer caller requests.
        uses:
            - mvp-playground-foundry-proj
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5-mini
        codeConfiguration:
            dependencyResolution: bundled
            entryPoint: Chapter05.ToolUse.Hosted.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: chapter05-tool-use
        protocols:
            - protocol: responses
              version: 2.0.0
    mvp-playground-foundry-proj:
        host: azure.ai.project
        endpoint: https://mvp-playground-foundry.services.ai.azure.com/api/projects/mvp-playground-foundry-proj
infra:
    provider: microsoft.foundry
