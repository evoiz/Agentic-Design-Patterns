# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    azd: '>=1.35.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.19'
name: chapter10-mcp
services:
    chapter10-mcp:
        project: .
        host: azure.ai.agent
        language: csharp
        startupCommand: dotnet run --project Chapter10.MCP.Hosted.csproj
        displayName: Chapter 10 - MCP
        description: Uses a configured remote MCP server through Microsoft Agent Framework.
        uses:
            - mvp-playground-foundry-proj
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5-mini
            CHAPTER10_MCP_SERVER_URL: ${CHAPTER10_MCP_SERVER_URL}
        codeConfiguration:
            dependencyResolution: bundled
            entryPoint: Chapter10.MCP.Hosted.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: chapter10-mcp
        protocols:
            - protocol: responses
              version: 2.0.0
    mvp-playground-foundry-proj:
        host: azure.ai.project
        endpoint: https://mvp-playground-foundry.services.ai.azure.com/api/projects/mvp-playground-foundry-proj
infra:
    provider: microsoft.foundry
