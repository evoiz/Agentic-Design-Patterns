# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    azd: '>=1.35.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.19'
name: chapter13-human-in-the-loop
services:
    chapter13-human-in-the-loop:
        project: .
        host: azure.ai.agent
        language: csharp
        startupCommand: dotnet run --project Chapter13.HumanInTheLoop.Hosted.csproj
        displayName: Chapter 13 - Human-in-the-Loop
        description: Handles customer support requests and pauses for human approval before escalation.
        uses:
            - mvp-playground-foundry-proj
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5-mini
        codeConfiguration:
            dependencyResolution: bundled
            entryPoint: Chapter13.HumanInTheLoop.Hosted.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: chapter13-human-in-the-loop
        protocols:
            - protocol: invocations
              version: 2.0.0
    mvp-playground-foundry-proj:
        host: azure.ai.project
        endpoint: https://mvp-playground-foundry.services.ai.azure.com/api/projects/mvp-playground-foundry-proj
infra:
    provider: microsoft.foundry
