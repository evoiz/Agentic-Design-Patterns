# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    azd: '>=1.35.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.19'
name: extension01-agent-harness
services:
    extension01-agent-harness:
        project: .
        host: azure.ai.agent
        language: csharp
        startupCommand: dotnet run --project Extension01.AgentHarness.Hosted.csproj
        displayName: Enterprise Extension 01 - Agent Harness
        description: Bounded read-only support triage with todos, synthetic evidence, and explicit termination.
        uses:
            - mvp-playground-foundry-proj
        env:
            FOUNDRY_PROJECT_ENDPOINT: ${AZURE_AI_PROJECT_ENDPOINT}
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            Harness__EnableSensitiveTelemetry: "true"
        codeConfiguration:
            dependencyResolution: bundled
            entryPoint: Extension01.AgentHarness.Hosted.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: extension01-agent-harness
        protocols:
            - protocol: responses
              version: 2.0.0
    mvp-playground-foundry-proj:
        host: azure.ai.project
        endpoint: https://mvp-playground-foundry.services.ai.azure.com/api/projects/mvp-playground-foundry-proj
infra:
    provider: microsoft.foundry
