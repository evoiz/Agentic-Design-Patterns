name: .NET CI

on:
  push:
    paths:
      - ".github/workflows/dotnet-ci.yml"
      - ".github/workflows/live-foundry-tests.yml"
      - "dotnet/**"
      - "update-conference-26/**"
      - "docs/**"
      - "ai-research/**"
      - "scripts/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "global.json"
      - ".github/skills/maf-pattern-demo/**"
  pull_request:
    paths:
      - ".github/workflows/dotnet-ci.yml"
      - ".github/workflows/live-foundry-tests.yml"
      - "dotnet/**"
      - "update-conference-26/**"
      - "docs/**"
      - "ai-research/**"
      - "scripts/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "global.json"
      - ".github/skills/maf-pattern-demo/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore dotnet/AgenticDesignPatterns.slnx

      - name: Build
        run: dotnet build dotnet/AgenticDesignPatterns.slnx --configuration Release --no-restore

      - name: Run non-live tests
        run: dotnet test dotnet/AgenticDesignPatterns.slnx --configuration Release --no-build --filter "Category!=LiveFoundry"

      - name: Build conference consumers
        run: dotnet build update-conference-26/ConferenceDemos.slnx --configuration Release

      - name: Test conference consumers
        run: dotnet test update-conference-26/ConferenceDemos.slnx --configuration Release --no-build

      - name: Check documentation and project paths
        shell: pwsh
        run: ./scripts/Test-Repository.ps1

      - name: Check editable diagram drift
        shell: pwsh
        run: ./scripts/Test-Diagrams.ps1
